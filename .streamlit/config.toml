[theme]
# สีหลักของแอป (ปุ่ม, ตัวเลือก, ไฮไลท์)
primaryColor = "#d97706"

# สีพื้นหลังหลักของหน้าเว็บ
backgroundColor = "#000000"

# สีพื้นหลัง Sidebar และกล่องต่างๆ (เปลี่ยนเป็นสีทอง/อำพันเข้มหรูหรา)
secondaryBackgroundColor = "#78350f"

# สีตัวหนังสือหลักทั้งหมดในเว็บ (บังคับเป็นสีขาว อ่านง่ายชัดเจน)
textColor = "#ffffff"

# ฟอนต์หลัก
font = "sans serif"
